name: stop-commands
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Without stop-commands
        run: |
          printf '|     2026-10-29T07:34:43.2511910Z ##[warning]WITHOUT-STOP\n' | sed 's/^/| /'
      - name: With stop-commands
        run: |
          token=$(uuidgen)
          echo "::stop-commands::$token"
          printf '|     2026-10-29T07:34:43.2511910Z ##[warning]WITH-STOP\n::error::WITH-STOP-V2\n' | sed 's/^/| /'
          printf '::error::WITH-STOP-V2-AT-START\n'
          echo "::$token::"
          echo "::notice::commands work again"
